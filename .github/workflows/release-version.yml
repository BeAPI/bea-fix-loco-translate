name: Deploy to WordPress.org

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (example: 1.2.0 or v1.2.0)'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          if [ -z "${TAG}" ]; then
            echo "Tag is empty."
            exit 1
          fi

          git fetch --tags --force
          git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1 || {
            echo "Tag '${TAG}' does not exist."
            exit 1
          }

          git checkout "refs/tags/${TAG}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Publish to WP.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: bea-fix-loco-translate

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: ${{ github.workspace }}/bea-fix-loco-translate.zip
